[package]
name = "boat-maintenance-display"
version = "0.1.0"
description = "LightHouse 4 client for the onboard boat maintenance server"
authors = ["boat_maintenance contributors"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"

# SD 카드 설치 PoC APK가 Rust 디버그 심볼 때문에 100MB를 넘지 않게 한다.
# debug 빌드/로그는 유지하되 네이티브 심볼만 제외한다.
[profile.dev]
debug = 0
strip = "debuginfo"
